spring.application.name=sistema-oficina
server.port=8080

# Banco H2 salvo em arquivo local para não perder dados ao reiniciar
spring.datasource.url=jdbc:h2:file:./database/oficina_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza tabelas automaticamente e roda o data.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Console visual do banco (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console